<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Kino XII</title>
    <link rel="stylesheet" href="Styles/styles.css" /> <!-- main page stylesheet -->
    <link rel="stylesheet" href="Styles/header-styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="header-brand-group">
        <h2 class="brand header-brand">
          Kino <span class="accent-text">XII</span>
        </h2>

        <a href="/sessions">Sessions</a>
      </div>

      <div class="header-actions">
        <search class="header-search">
          <label for="movie" class="visually-hidden">
            Search films and live events
          </label>

          <input
            type="search"
            id="movie"
            name="q"
            placeholder="Search films and live events"
          />

          <button type="submit" aria-label="Search">
            <!-- SVG -->
          </button>
        </search>

        <button class="auth-button sign-up-button" type="button">
          Sign Up
        </button>

        <button class="auth-button login-button" type="button">Log In</button>
      </div>
    </header>
    <main>
      <section class="hero-carousel" aria-label="Featured movies">
        <ul aria-live="polite"></ul>
        <div class="carousel-controls" hidden>
          <nav class="carousel-pagination" aria-label="Choose a featured movie"></nav>
          <div class="carousel-arrows">
            <button
              class="carousel-button prev"
              type="button"
              aria-label="Previous slide"
            ></button>
            <button
              class="carousel-button next"
              type="button"
              aria-label="Next slide"
            ></button>
          </div>
        </div>
        <p class="carousel-status" role="status" hidden></p>
      </section>
      <section
        class="movie-section now-playing"
        aria-label="Now Playing"
      >
        <div class="section-heading">
          <h1 id="now-playing-title">Now Playing</h1>
          <button class="section-link" type="button">See all</button>
        </div>
        <div class="movie-card-rail now-playing-rail">
          <article
            class="now-playing-card"
            aria-label="Movie now playing"
          ></article>
          <article
            class="now-playing-card"
            aria-label="Movie now playing"
          ></article>
          <article
            class="now-playing-card"
            aria-label="Movie now playing"
          ></article>
          <article
            class="now-playing-card"
            aria-label="Movie now playing"
          ></article>
          <article
            class="now-playing-card"
            aria-label="Movie now playing"
          ></article>
        </div>
      </section>
      <section
        class="movie-section coming-soon"
        aria-label="Coming Soon"
      >
        <div class="section-heading">
          <h2 id="coming-soon-title">Coming Soon...</h2>
          <button class="section-link" type="button">See all</button>
        </div>
        <div class="movie-card-rail coming-soon-rail">
          <article
            class="coming-soon-card"
            aria-label="Movie coming soon"
          ></article>
          <article
            class="coming-soon-card"
            aria-label="Movie coming soon"
          ></article>
          <article
            class="coming-soon-card"
            aria-label="Movie coming soon"
          ></article>
          <article
            class="coming-soon-card"
            aria-label="Movie coming soon"
          ></article>
        </div>
      </section>
    </main>
    <footer>
      <p class="brand footer-brand">
        Kino <span class="accent-text">XII</span>
      </p>
      <p class="copyright-statement">All rights reserved</p>
    </footer>
    <script type="module" src="JS-modules/Interactivity/carousel.js"></script>
  </body>
</html>
