<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up for Kino XII</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/modal-styles.css" />
    <link rel="stylesheet" href="../styles/sign-up-modal-styles.css" />
  </head>
  <body>
    <div
      class="modal fade theater-modal signup-modal"
      id="signupModal"
      tabindex="-1"
      aria-labelledby="signupModalLabel"
      aria-hidden="true"
      role="dialog"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h1 class="modal-title" id="signupModalLabel">Sign up</h1>
              <p class="signup-subtitle">Welcome to Kino XII</p>
            </div>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form action="/signup-endpoint" method="POST" enctype="multipart/form-data">
            <div class="modal-body">
              <div class="signup-avatar">
                <label class="avatar-upload-button" for="avatarUpload" aria-label="Choose an avatar image">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5" />
                  </svg>
                </label>
                <input
                  class="visually-hidden"
                  type="file"
                  id="avatarUpload"
                  name="avatar"
                  accept="image/jpeg,image/png,image/webp"
                />
                <div class="avatar-upload-copy">
                  <label for="avatarUpload">Upload avatar (optional)</label>
                  <span>JPG, PNG or WEBP</span>
                </div>
              </div>

              <div class="signup-field">
                <label class="form-label" for="username">Username</label>
                <input
                  class="form-control"
                  type="text"
                  id="username"
                  name="username"
                  placeholder="User"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="signup-field">
                <label class="form-label" for="emailAddress">Email</label>
                <input
                  class="form-control"
                  type="email"
                  id="emailAddress"
                  name="email"
                  placeholder="example@gmail.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="signup-password-row">
                <div class="signup-field">
                  <label class="form-label" for="password">Password</label>
                  <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <div class="signup-field">
                  <label class="form-label" for="confirmPassword">Confirm password</label>
                  <input
                    class="form-control"
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="modal-footer signup-footer">
              <button class="btn signup-submit" type="submit">Sign up</button>
              <p class="signup-login-prompt">
                Already have an account?
                <a href="/login">Log in</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
