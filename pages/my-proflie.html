<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Profile</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="../styles/styles.css">
	<link rel="stylesheet" href="../styles/header-styles.css">
	<link rel="stylesheet" href="../styles/footer-styles.css">
	<link rel="stylesheet" href="../styles/profile-styles.css">
	<link rel="stylesheet" href="../styles/modal-styles.css">
	<link rel="stylesheet" href="../styles/sign-up-modal-styles.css">
	<link rel="stylesheet" href="../styles/login-modal-styles.css">
</head>
<body>
	<div id="site-header"></div>
	<main>
		<h1>My Profile</h1>
		<nav class="tabs" aria-label="Profile sections">
			<button class="tab active" type="button" id="profile-tab" aria-selected="true">Personal Information</button>
			<button class="tab" type="button" id="tickets-tab" aria-selected="false">My Tickets</button>
		</nav>
		<p class="profile-incomplete-banner" id="profile-incomplete-banner" role="status" hidden>Complete your profile to enable booking.</p>
		<p class="profile-eligibility" id="profile-eligibility" role="status" hidden></p>
		<section class="panel" id="profile-panel" aria-label="Personal information">
			<form id="profile-form">
				<div class="field"><label for="full-name">Full name</label><input id="full-name" name="fullName" type="text"></div>
				<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" readonly><p class="hint">Set at registration and cannot be changed</p></div>
				<div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobileNumber" type="tel"></div>
				<div class="field"><label for="birth-date">Date of birth</label><input id="birth-date" name="dateOfBirth" type="date" aria-label="Date of birth"></div>
				<div class="field"><label for="venue">Preferred Venue (Optional)</label><div class="select-wrap"><select id="venue" name="preferredVenueId"><option value="" selected>Choose a venue</option><option value="2">Batumi Boulevard</option><option value="1">Galleria Tbilisi</option><option value="3">Rustaveli Palace</option><option value="4">Vake Park</option></select></div></div>
				<div class="field"><label for="avatar">Avatar (Optional)</label><input id="avatar" name="avatar" type="file" accept="image/jpeg,image/png,image/webp"></div>
				<button class="save" type="submit">Save changes</button><span class="notice" id="save-notice" role="status"></span>
			</form>
		</section>
		<section class="panel tickets" id="tickets-panel" aria-label="My tickets" hidden></section>
	</main>
	<div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/render-pages/add-header-start.js"></script>
    <script type="module" src="../src/render-pages/add-footer-end.js"></script>
    <script type="module" src="../src/interactivity/search.js"></script>
    <script type="module" src="../src/interactivity/signup-modal.js"></script>
    <script type="module" src="../src/interactivity/login-modal.js"></script>
    <script type="module" src="../src/interactivity/user-menu.js"></script>
    <script type="module" src="../src/render-pages/protected-actions.js"></script>
    <script type="module" src="../src/API/profile.js"></script>
    <script type="module" src="../src/render-pages/tickets.js"></script>
</body>
</html>
